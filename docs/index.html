<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Below the Sunlit Reef</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <!-- The game fills the window. While the files download, a loading screen in the game's style sits over it; once the
         engine starts, the game's own loading screen (world building) takes over. -->
    <div id="game">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loader">
        <div class="glow"></div>
        <div class="small">B E L O W &nbsp; T H E</div>
        <div class="big">SUNLIT REEF</div>
        <div class="rule"></div>
        <div id="status">Surfacing the files...</div>
        <div class="bar"><div id="fill"></div></div>
        <div id="pct">0%</div>
        <div class="hint">First visit downloads about 45 MB. After that it loads from your browser's cache.</div>
      </div>
      <div id="fullscreen" title="Full screen">&#x26F6;</div>
      <div id="warning"></div>
    </div>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loader = document.querySelector("#loader");
      const fill = document.querySelector("#fill");
      const pct = document.querySelector("#pct");
      const status = document.querySelector("#status");

      function unityShowBanner(msg, type) {
        const w = document.querySelector("#warning");
        const div = document.createElement("div");
        div.textContent = msg;
        div.className = type == "error" ? "err" : "warn";
        w.appendChild(div);
        if (type != "error") setTimeout(() => div.remove(), 5000);
      }

      const buildUrl = "Build";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "GraveBear",
        productName: "Below the Sunlit Reef",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        autoSyncPersistentDataPath: true,      // saves (journal, research, cargo) persist between visits
      };

      const script = document.createElement("script");
      script.src = buildUrl + "/Web.loader.js";
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          const p = Math.round(progress * 100);
          fill.style.width = p + "%";
          pct.textContent = p + "%";
          status.textContent = progress < 0.9 ? "Downloading the reef..." : "Starting the engine...";
        }).then((unityInstance) => {
          // the engine is running: the game draws its own loading screen while it builds the world
          loader.classList.add("gone");
          setTimeout(() => loader.remove(), 300);
          document.querySelector("#fullscreen").onclick = () => {
            const el = document.querySelector("#game");
            try {
              const p = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);
              if (p && p.catch) p.catch(() => {});
            } catch (e) { }
          };
        }).catch((message) => {
          status.textContent = "Could not start: " + message;
          status.classList.add("bad");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
